<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilangual Dictionary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     


    <div class="container">
        <h1><i class="fa-solid fa-language icon"></i>Multilangual Dictionary</h1>
        <div class="input-group">
            <input type="text" id="wordinput" placeholder="Enter a word or sentence">

            <select  id="language-select">
                <option value="en">en English</option>
                <option value="ne">ne Nepali</option>
                <option value="es">es Spanish</option>
                <option value="fr">fr French</option>
                <option value="de">de German</option>
                <option value="ja">ja Japanese</option>
                <option value="ko">ko Korean</option>
            </select>

            <button id="microphoneBtm" onclick="togglSpeechRecognition()">
                <i class="fas fa-microphone icon"></i>
                <span id="mic-test">Speak now</span>
            </button>
        </div>

        <button onclick="searchwords()"><i class="fas fa-search "></i>Search</button>

        <div id="result"></div>

    </div>


    <div id="speechModal" class="speech-model">
        <div class="speech-modal-content">
            <div class="speech-modal-header">
                <h2>Speak Now</h2>
                <button id="closeModelBtn" onclick="closespeechModal()">&times;</button>
            </div>
            <div class="speech-modal-body">
                <p>Listening.....</p>
            </div>
        </div>
    </div>
    


    <script src="script.js"></script>
</body>
</html>
